plugins {
    id 'com.android.application'
}

// Oyster player for Meta Quest (OpenXR + GLES 3). The native part is the shared runtime
// (runtime/CMakeLists.txt) plus apps/quest/app/src/main/cpp. Pearl's data is NOT packaged:
// the user copies their own installation to the app's external files directory (README.md).
def openxrRoot = 'C:/OpenXR/install/android-arm64-v8a'

// Release signing: a keystore.properties (storeFile, storePassword, keyAlias, keyPassword) outside
// the repository, path from -PoysterKeystore=... or OYSTER_KEYSTORE; without it the release build
// stays unsigned.
def keystoreFile = project.findProperty('oysterKeystore') ?: System.getenv('OYSTER_KEYSTORE')
def keystoreProps = new Properties()
if (keystoreFile && file(keystoreFile).exists()) file(keystoreFile).withInputStream { keystoreProps.load(it) }

android {
    namespace 'org.oyster.pearl'
    compileSdk 35
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId 'org.oyster.pearl'
        minSdk 32
        targetSdk 35
        versionCode 1
        versionName '0.1.0'

        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                arguments "-DOYSTER_OPENXR_ANDROID_ROOT=${openxrRoot}", '-DANDROID_STL=c++_static'
            }
        }
    }

    signingConfigs {
        release {
            if (keystoreProps['storeFile']) {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            // the engine is far too slow unoptimised; keep symbols for crash reports
            externalNativeBuild {
                cmake {
                    arguments '-DCMAKE_BUILD_TYPE=RelWithDebInfo'
                }
            }
        }
        release {
            minifyEnabled false
            if (keystoreProps['storeFile']) signingConfig signingConfigs.release
            externalNativeBuild {
                cmake {
                    arguments '-DCMAKE_BUILD_TYPE=RelWithDebInfo'  // same code as the tested debug build
                }
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs "${openxrRoot}/jni"
        }
    }

    lint {
        checkReleaseBuilds false  // native app without Java code; lint needs online artifacts
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }
}
